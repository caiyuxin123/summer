[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-residual-carbon-accounting"
version = "2.2.0"
description = "Reproducible research code for scale-residual correction of monthly electricity carbon responsibility"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8"
]

[project.scripts]
scale-residual = "scale_residual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
